<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sismos Chile</title>
<meta name="description" content="Sismos, farmacias de turno, clima y calidad del aire en Chile, en tiempo real y con fuentes oficiales. Sin publicidad ni rastreo.">
<meta name="theme-color" content="#0f1216">
<link rel="manifest" href="manifest.webmanifest?v=7">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>

<header class="barra">
  <h1>Sismos Chile</h1>
  <div class="barra-btns">
    <button id="btn-ubicacion" class="icono" title="Usar mi ubicación" aria-label="Usar mi ubicación">◎</button>
    <button id="btn-tema" class="icono" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    <button id="btn-ajustes" class="icono" title="Ajustes" aria-label="Ajustes">⚙</button>
    <button id="btn-refrescar" class="icono" title="Actualizar" aria-label="Actualizar">↻</button>
  </div>
</header>

<nav class="pestanias" role="tablist" aria-label="Secciones">
  <button class="pestania" role="tab" data-vista="sismos" aria-selected="true">Sismos</button>
  <button class="pestania" role="tab" data-vista="farmacias" aria-selected="false">Farmacias de turno</button>
  <button class="pestania" role="tab" data-vista="clima" aria-selected="false">Clima</button>
  <button class="pestania" role="tab" data-vista="aire" aria-selected="false">Calidad del aire</button>
</nav>

<p id="estado" class="estado" role="status" aria-live="polite"></p>

<main>
  <section id="resumen" class="resumen"></section>

  <section class="mapa-caja">
    <svg id="mapa" viewBox="0 0 0 0" role="img" aria-label="Mapa de Chile"></svg>
    <div class="mapa-btns">
      <button id="zoom-mas" class="icono" aria-label="Acercar">+</button>
      <button id="zoom-menos" class="icono" aria-label="Alejar">−</button>
      <button id="zoom-reset" class="icono" aria-label="Ajustar el mapa">⤢</button>
    </div>
    <ul id="leyenda" class="leyenda"></ul>
  </section>

  <div class="panel" data-vista="sismos">
    <section class="filtros filtros-3">
      <label class="filtro">
        <span>Zona</span>
        <select id="f-ambito">
          <option value="chile">Chile</option>
          <option value="mundo">Todo el mundo</option>
        </select>
      </label>
      <label class="filtro">
        <span>Magnitud <b id="f-mag-val"></b></span>
        <input id="f-mag" type="range" min="0" max="6" step="0.5">
      </label>
      <label class="filtro">
        <span>Periodo</span>
        <select id="f-dias">
          <option value="1">Últimas 24 horas</option>
          <option value="3">Últimos 3 días</option>
          <option value="7">Última semana</option>
          <option value="30">Último mes</option>
        </select>
      </label>
    </section>
    <section id="lista" class="lista"></section>
  </div>

  <div class="panel" data-vista="farmacias" hidden>
    <section class="filtros">
      <label class="filtro">
        <span>Comuna</span>
        <select id="f-comuna"><option value="">Todo Chile</option></select>
      </label>
      <label class="filtro check-filtro">
        <span>Disponibilidad</span>
        <label class="check">
          <input id="f-abiertas" type="checkbox">
          <span>Solo las abiertas ahora</span>
        </label>
      </label>
    </section>
    <section id="lista-farmacias" class="lista"></section>
  </div>

  <div class="panel" data-vista="clima" hidden>
    <section class="filtros">
      <label class="filtro">
        <span>Ciudad</span>
        <select id="f-ciudad"></select>
      </label>
    </section>
    <section id="lista-clima"></section>
  </div>

  <div class="panel" data-vista="aire" hidden>
    <section class="filtros">
      <label class="filtro">
        <span>Región</span>
        <select id="f-region"><option value="">Todo Chile</option></select>
      </label>
      <label class="filtro">
        <span>Contaminante</span>
        <select id="f-contaminante">
          <option value="PM25">Material particulado fino (MP-2,5)</option>
          <option value="PM10">Material particulado (MP-10)</option>
          <option value="0008">Ozono</option>
          <option value="0003">Dióxido de nitrógeno</option>
          <option value="0001">Dióxido de azufre</option>
          <option value="0004">Monóxido de carbono</option>
        </select>
      </label>
    </section>
    <section id="lista-aire" class="lista"></section>
  </div>
</main>

<footer>
  <p id="creditos"></p>
  <p class="fina">Sin publicidad, sin rastreo. Los datos se guardan solo en este dispositivo.
     <a href="privacidad.html">Privacidad</a> ·
     <a href="https://github.com/Rodrigobade/sismos-chile">Código fuente</a></p>
</footer>

<dialog id="detalle">
  <button class="cerrar" aria-label="Cerrar">×</button>
  <div id="detalle-cuerpo"></div>
</dialog>

<dialog id="ajustes">
  <button class="cerrar" aria-label="Cerrar">×</button>
  <h2>Ajustes</h2>
  <label class="filtro">
    <span>Avisarme de sismos <b id="f-umbral-val"></b></span>
    <input id="f-umbral" type="range" min="3" max="7" step="0.5">
  </label>
  <label class="check">
    <input id="f-avisos" type="checkbox">
    <span>Activar avisos mientras la app está abierta</span>
  </label>
  <p class="fina">Los avisos llegan cuando la app está abierta o en segundo plano reciente.
     Ningún dato sale de tu teléfono.</p>
</dialog>

<script src="geo.js?v=7"></script>
<script src="mundo.js?v=7"></script>
<script src="app.js?v=7"></script>
<script src="aire.js?v=7"></script>
<script src="farmacias.js?v=7"></script>
<script src="clima.js?v=7"></script>
</body>
</html>
